<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e89aa5">
<title>小账本</title>
<style>
:root{--bg:#fff8f5;--card:#fffdfb;--ink:#594746;--muted:#a18b88;--accent:#e89aa5;--accent2:#f6c9cc;--red:#d96f83;--line:#f3e3df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:var(--ink);padding:18px 14px 36px}
main{max-width:560px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}.top h1{font-size:25px;margin:0}.tag{font-size:12px;color:#c97883;background:#fdebed;padding:6px 10px;border-radius:99px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 22px #b77b7412}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:7px}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:#c97883}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.budget-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.big{font-size:28px;font-weight:750;letter-spacing:-.5px;margin:3px 0}.sub{font-size:12px;color:var(--muted)}.progress{height:13px;background:#f7e9e3;border-radius:99px;overflow:hidden;margin:15px 0 8px}.bar{height:100%;width:0;background:linear-gradient(90deg,#e89aa5,#f5c4c7);border-radius:99px;transition:width .3s}.bar.over{background:linear-gradient(90deg,#d96f83,#f4a7a0)}.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.section-title{font-size:16px;font-weight:700;margin:0 0 14px}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}.btn:active{transform:scale(.99)}.btn.secondary{background:#fdebed;color:#c97883}.btn.full{width:100%;margin-top:13px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .box{background:#fff4f1;border-radius:14px;padding:13px}.summary .number{font-size:20px;font-weight:750;margin-top:5px;overflow-wrap:anywhere}.expense{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.expense:last-child{border-bottom:0;padding-bottom:0}.icon{width:42px;height:42px;border-radius:14px;background:#fdebed;display:grid;place-items:center;font-size:20px;flex-shrink:0}.exp-main{flex:1;min-width:0}.exp-title{font-weight:650;overflow-wrap:anywhere}.exp-note{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:750;color:var(--red);white-space:nowrap}.delete{border:0;background:transparent;color:#aaa;font-size:18px;padding:5px 0 5px 8px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 2px}.danger{color:var(--red)}@media(max-width:360px){.row{grid-template-columns:1fr}.big{font-size:24px}}
</style>
</head>
<body>
<main>
  <header class="top"><h1>🌷 小账本</h1><span class="tag">只保存在本机</span></header>
  <section class="card">
    <div class="field">
      <label for="month">记账月份（可自行切换）</label>
      <input id="month" type="month">
    </div>
    <div class="budget-head" style="margin-top:18px">
      <div><div class="sub">本月已支出</div><div class="big" id="spent">¥0.00</div></div>
      <div style="text-align:right"><div class="sub">你设置的预算/目标</div><div class="big" id="budgetLabel">¥0.00</div></div>
    </div>
    <div class="progress" role="progressbar" aria-label="预算使用进度"><div class="bar" id="bar"></div></div>
    <div class="progress-meta"><span id="progressText">已使用 0%</span><span id="remaining">剩余 ¥0.00</span></div>
    <div class="field" style="margin-top:17px">
      <label for="budget">设置本月预算/进度条满格金额（元）</label>
      <input id="budget" type="number" min="0" step="0.01" placeholder="例如：2000">
    </div>
    <button class="btn secondary full" id="saveBudget">保存本月预算</button>
  </section>

  <section class="card">
    <h2 class="section-title">➕ 记一笔支出</h2>
    <form id="expenseForm">
      <div class="row">
        <div class="field"><label for="amountInput">金额（元）</label><input id="amountInput" type="number" min="0.01" step="0.01" placeholder="例如：18.50" required></div>
        <div class="field"><label for="category">分类</label><select id="category"><option>餐饮</option><option>购物</option><option>交通</option><option>娱乐</option><option>学习</option><option>生活</option><option>医疗</option><option>其他</option></select></div>
      </div>
      <div class="field" style="margin-top:12px"><label for="note">备注（可不填）</label><input id="note" maxlength="80" placeholder="例如：午饭、奶茶、游戏"></div>
      <div class="field" style="margin-top:12px"><label for="date">支出日期</label><input id="date" type="date" required></div>
      <button class="btn full" type="submit">记下这笔支出</button>
    </form>
  </section>

  <section class="card">
    <h2 class="section-title">📊 本月概览</h2>
    <div class="summary">
      <div class="box"><div class="sub">支出笔数</div><div class="number" id="count">0 笔</div></div>
      <div class="box"><div class="sub">平均每笔</div><div class="number" id="average">¥0.00</div></div>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">🧾 支出记录 <span class="sub" id="listMonth"></span></h2>
    <div id="expenses"></div>
  </section>
  <p class="hint">使用说明：切换月份后，可分别设置该月预算并查看该月支出。数据保存在当前浏览器/设备中，不会自动同步到其他设备。清理浏览器数据或更换浏览器可能导致记录丢失，建议定期备份。</p>
</main>
<script>
const $ = id => document.getElementById(id);
const today = new Date();
const pad = n => String(n).padStart(2,'0');
const localDate = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const currentMonth = localDate.slice(0,7);
$('month').value = currentMonth; $('date').value = localDate;
let db = {};
try { db = JSON.parse(localStorage.getItem('xiaozhangben_v1') || '{}'); } catch(e) { db = {}; }
function monthKey(){ return $('month').value || currentMonth; }
function getMonthData(key=monthKey()){ if(!db[key]) db[key]={budget:0,expenses:[]}; if(!Array.isArray(db[key].expenses)) db[key].expenses=[]; return db[key]; }
function save(){ localStorage.setItem('xiaozhangben_v1', JSON.stringify(db)); render(); }
function money(n){ return '¥' + Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const icons={'餐饮':'🍜','购物':'🛍️','交通':'🚌','娱乐':'🎮','学习':'📚','生活':'🏠','医疗':'💊','其他':'🧾'};
function render(){
 const key=monthKey(), d=getMonthData(key), total=d.expenses.reduce((s,e)=>s+Number(e.amount),0), budget=Number(d.budget)||0;
 $('spent').textContent=money(total); $('budgetLabel').textContent=money(budget);
 const pct=budget>0?total/budget*100:0;
 $('bar').style.width=Math.min(pct,100)+'%'; $('bar').classList.toggle('over',budget>0&&total>budget);
 $('progressText').textContent=budget>0?`已使用 ${Math.round(pct)}%`:'请先设置预算金额';
 $('remaining').textContent=budget>0?(total>budget?`超出 ${money(total-budget)}`:`剩余 ${money(budget-total)}`):'未设置预算';
 $('budget').value=d.budget||''; $('count').textContent=d.expenses.length+' 笔'; $('average').textContent=money(d.expenses.length?total/d.expenses.length:0);
 $('listMonth').textContent=key;
 const list=$('expenses'); list.innerHTML='';
 const items=[...d.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);
 if(!items.length){list.innerHTML='<div class="empty">这个月还没有支出记录，记下第一笔吧～</div>';return;}
 for(const e of items){
  const el=document.createElement('div'); el.className='expense';
  el.innerHTML=`<div class="icon">${icons[e.category]||'🧾'}</div><div class="exp-main"><div class="exp-title">${escapeHtml(e.category)}${e.note?' · '+escapeHtml(e.note):''}</div><div class="exp-note">${escapeHtml(e.date||'')}</div></div><div class="amount">-${money(e.amount)}</div><button class="delete" aria-label="删除记录" title="删除">×</button>`;
  el.querySelector('button').addEventListener('click',()=>{if(confirm('确定删除这笔支出吗？')){d.expenses=d.expenses.filter(x=>x.id!==e.id);save();}});
  list.appendChild(el);
 }
}
$('month').addEventListener('change',render);
$('saveBudget').addEventListener('click',()=>{
 const v=Number($('budget').value);
 if(!Number.isFinite(v)||v<0){alert('请输入不小于 0 的预算金额。');return;}
 getMonthData().budget=Math.round(v*100)/100; save();
});
$('expenseForm').addEventListener('submit',e=>{
 e.preventDefault(); const amount=Number($('amountInput').value), date=$('date').value;
 if(!Number.isFinite(amount)||amount<=0){alert('请输入大于 0 的支出金额。');return;}
 if(!date){alert('请选择支出日期。');return;}
 const key=date.slice(0,7), d=getMonthData(key);
 d.expenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),amount:Math.round(amount*100)/100,category:$('category').value,note:$('note').value.trim(),date,created:Date.now()});
 $('amountInput').value=''; $('note').value=''; $('month').value=key; save();
});
render();
</script>
</body>
</html>
