name: Build Xiaozhangben APK

on:
  workflow_dispatch:
  push:
    paths:
      - '小账本粉色APK工程/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: 小账本粉色APK工程
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-debug-apk
          path: 小账本粉色APK工程/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: 
          error
